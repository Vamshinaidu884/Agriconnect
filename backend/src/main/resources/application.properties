# ArgiMatch Backend Configuration
spring.application.name=ArgiMatch

# MongoDB Atlas Connection (REPLACE WITH YOUR OWN)
spring.data.mongodb.uri=mongodb+srv://agrimatch:agrimatch123@cluster0.mongodb.net/agrimatch?retryWrites=true&w=majority
spring.data.mongodb.database=agrimatch

# For local MongoDB (use this if Atlas is not set up)
# spring.data.mongodb.host=localhost
# spring.data.mongodb.port=27017
# spring.data.mongodb.database=agrimatch

# Server
server.port=8080

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
